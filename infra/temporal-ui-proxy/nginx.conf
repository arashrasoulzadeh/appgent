events {}

http {
  # Docker's embedded DNS — re-resolve the upstream on every request instead
  # of caching whatever IP it had at nginx startup, so this proxy survives
  # temporal-ui being recreated (new container IP) without needing a restart.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8080;

    auth_basic "Temporal UI";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    location / {
      set $upstream http://temporal-ui:8080;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;

      # Temporal UI uses websockets for live updates
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
