services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: appgent
      POSTGRES_PASSWORD: appgent
      POSTGRES_DB: appgent
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: appgent
      POSTGRES_PWD: appgent
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres
    ports:
      - "17233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:13000
    depends_on:
      - temporal
    ports:
      - "18233:8080"

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data

  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    volumes:
      - ./internal/db/migrations:/migrations
    depends_on:
      - postgres
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable",
        "up",
      ]

  seed:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
    depends_on:
      - postgres
    entrypoint: ["go", "run", "./cmd/seed"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
      TEMPORAL_HOST_PORT: temporal:7233
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - temporal
      - minio
    ports:
      - "18080:8080"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
      TEMPORAL_HOST_PORT: temporal:7233
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - temporal
      - minio

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18080/api/v1}
    depends_on:
      - api
    ports:
      - "13000:3000"

volumes:
  postgres_data:
  minio_data:
