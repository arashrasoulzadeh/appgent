services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: appgent
      POSTGRES_PASSWORD: appgent
      POSTGRES_DB: appgent
    volumes:
      - postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: appgent
      POSTGRES_PWD: appgent
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:23000
    depends_on:
      - temporal

  temporal-ui-htpasswd:
    image: httpd:2.4-alpine
    profiles: ["tools"]
    env_file: .env
    volumes:
      - temporal_ui_auth:/auth
    entrypoint: ["sh", "-c", "htpasswd -cb /auth/.htpasswd \"$$TEMPORAL_UI_USER\" \"$$TEMPORAL_UI_PASSWORD\""]

  temporal-ui-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - temporal-ui
    volumes:
      - ./infra/temporal-ui-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - temporal_ui_auth:/etc/nginx/auth:ro
    ports:
      - "28233:8080"

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    volumes:
      - ./internal/db/migrations:/migrations
    depends_on:
      - postgres
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable",
        "up",
      ]

  seed:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
    depends_on:
      - postgres
    entrypoint: ["go", "run", "./cmd/seed"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
      TEMPORAL_HOST_PORT: temporal:7233
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - temporal
      - minio
    ports:
      - "28080:8080"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://appgent:appgent@postgres:5432/appgent?sslmode=disable
      TEMPORAL_HOST_PORT: temporal:7233
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env reach
    # an Ollama server running on the host (not in this compose network).
    # Docker Desktop (Mac/Windows) resolves host.docker.internal natively;
    # on Linux this extra_hosts entry is required for it to resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - temporal
      - minio

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:28080/api/v1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:28080/api/v1}
    depends_on:
      - api
    ports:
      - "23000:3000"

volumes:
  postgres_data:
  minio_data:
  temporal_ui_auth:
