name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_DSN: postgres://appgent:appgent@localhost:5432/appgent?sslmode=disable
  TEMPORAL_HOST_PORT: localhost:7233
  TEMPORAL_NAMESPACE: default
  OBJECT_STORAGE_ENDPOINT: http://localhost:9000
  OBJECT_STORAGE_BUCKET: appgent-runs
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin
  LOG_LEVEL: info
  API_PORT: 8080
  JWT_SIGNING_SECRET: test-secret
  SESSION_COOKIE_NAME: session
  SESSION_TTL_HOURS: 168
  CORS_ALLOWED_ORIGIN: http://localhost:3000
  ADMIN_SEED_EMAIL: admin
  ADMIN_SEED_PASSWORD: admin
  OPENROUTER_API_KEY: sk-or-test
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL_PLAN: nvidia/nemotron-3-ultra-550b-a55b:free
  OPENROUTER_MODEL_DESIGN: nvidia/nemotron-3-ultra-550b-a55b:free
  OPENROUTER_MODEL_CODE: nvidia/nemotron-3-ultra-550b-a55b:free
  OPENROUTER_MODEL_QA: nvidia/nemotron-3-ultra-550b-a55b:free
  OPENROUTER_MODEL_EMBEDDING: nvidia/nemotron-3-ultra-550b-a55b:free
  MAX_QA_RETRIES: 3
  WORKER_MAX_CONCURRENT_ACTIVITIES: 10
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appgent
          POSTGRES_PASSWORD: appgent
          POSTGRES_DB: appgent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run Go tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      - name: Build Go binaries
        run: |
          go build ./services/api/cmd/api
          go build ./services/worker/cmd/worker
          go build ./cmd/seed
          go build ./cmd/seed-patterns

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./apps/web
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript check
        working-directory: ./apps/web
        run: npx tsc --noEmit
      - name: Run linter
        working-directory: ./apps/web
        run: pnpm lint
      - name: Run unit tests
        working-directory: ./apps/web
        run: pnpm test
      - name: Build Next.js
        working-directory: ./apps/web
        run: pnpm build

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appgent
          POSTGRES_PASSWORD: appgent
          POSTGRES_DB: appgent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      temporal:
        image: temporalio/auto-setup:latest
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_USER: appgent
          POSTGRES_PWD: appgent
          POSTGRES_SEEDS: postgres
        ports: ["7233:7233"]
      temporal-ui:
        image: temporalio/ui:latest
        env:
          TEMPORAL_ADDRESS: temporal:7233
        ports: ["8233:8080"]
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000", "9001:9001"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build API server
        run: go build -o api ./services/api/cmd/api
      - name: Build worker
        run: go build -o worker ./services/worker/cmd/worker
      - name: Build seed
        run: go build -o seed ./cmd/seed
      - name: Run migrations
        run: |
          ./seed
        env:
          POSTGRES_DSN: postgres://appgent:appgent@localhost:5432/appgent?sslmode=disable
          ADMIN_SEED_EMAIL: admin
          ADMIN_SEED_PASSWORD: admin
      - name: Start API server
        run: |
          ./api &
          sleep 5
          curl -f http://localhost:8080/healthz
        env:
          POSTGRES_DSN: postgres://appgent:appgent@localhost:5432/appgent?sslmode=disable
          TEMPORAL_HOST_PORT: localhost:7233
          TEMPORAL_NAMESPACE: default
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: appgent-runs
          OBJECT_STORAGE_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_SECRET_KEY: minioadmin
          API_PORT: 8080
          JWT_SIGNING_SECRET: test-secret
          SESSION_COOKIE_NAME: session
          SESSION_TTL_HOURS: 168
          CORS_ALLOWED_ORIGIN: http://localhost:3000
          ADMIN_SEED_EMAIL: admin
          ADMIN_SEED_PASSWORD: admin
      - name: Start Temporal worker
        run: |
          ./worker &
          sleep 3
        env:
          POSTGRES_DSN: postgres://appgent:appgent@localhost:5432/appgent?sslmode=disable
          TEMPORAL_HOST_PORT: localhost:7233
          TEMPORAL_NAMESPACE: default
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: appgent-runs
          OBJECT_STORAGE_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_SECRET_KEY: minioadmin
          OPENROUTER_API_KEY: sk-or-test
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_MODEL_PLAN: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_MODEL_DESIGN: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_MODEL_CODE: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_MODEL_QA: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_MODEL_EMBEDDING: nvidia/nemotron-3-ultra-550b-a55b:free
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        working-directory: ./apps/web
        run: npx playwright install --with-deps webkit
      - name: Run E2E tests
        working-directory: ./apps/web
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: ./apps/web
        run: pnpm install --frozen-lockfile
      - name: Generate version
        id: version
        run: echo "version=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o appgent-api ./services/api/cmd/api
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o appgent-worker ./services/worker/cmd/worker
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o appgent-seed ./cmd/seed
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o appgent-seed-patterns ./cmd/seed-patterns
      - name: Build frontend
        working-directory: ./apps/web
        run: pnpm build
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            appgent-api
            appgent-worker
            appgent-seed
            appgent-seed-patterns
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}