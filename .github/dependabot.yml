version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    reviewers:
      - "arashrasoulzadeh"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "go"
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    reviewers:
      - "arashrasoulzadeh"
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "npm"
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    reviewers:
      - "arashrasoulzadeh"
    groups:
      frontend-deps:
        patterns:
          - "@radix-ui/*"
          - "@testing-library/*"
          - "lucide-react"
          - "axios"
          - "zod"
          - "clsx"
          - "tailwind-merge"
          - "class-variance-authority"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "@playwright/*"
          - "@types/*"
          - "@vitejs/*"
          - "vitest"
          - "eslint*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"