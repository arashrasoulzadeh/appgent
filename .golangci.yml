run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters-settings:
  govet:
    check-shadowing: true
  gocyclo:
    min-complexity: 15
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 200
  gosec:
    excludes:
      - G104 # Errors unhandled
      - G304 # CGI execution
  staticcheck:
    checks: ["all", "-ST1000"]

linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
  disable:
    - gochecknoglobals
    - godox
    - wrapcheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gosec
        - lll
    - path: main\.go
      linters:
        - funlen
    - path: cmd/seed
      linters:
        - funlen

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true